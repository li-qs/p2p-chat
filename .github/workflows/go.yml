name: build

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: go vet
        run: go vet ./internal/... ./cmd/...

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build
        run: CGO_ENABLED=0 go build -o build/p2p-chat ./cmd/app/
      - uses: actions/upload-artifact@v4
        with:
          name: p2p-chat
          path: build/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 go build -o build/p2p-chat-${{ matrix.goos }}-${{ matrix.goarch}}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/app/
      - uses: actions/upload-artifact@v4
        with:
          name: p2p-chat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/
      - name: release
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          generateReleaseNotes: true
